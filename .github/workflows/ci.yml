name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv sync --frozen --python 3.12
      - run: bash scripts/test_project.sh
  containers:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Compose configuration
        env:
          ROBOINSPECT_ROOT: ${{ github.workspace }}
        run: docker compose config --quiet
      - name: Build images and verify HTTP and persistent MLflow data
        run: python3 scripts/check_compose_ci.py
      - name: Upload container check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-check-results
          path: artifacts/compose-ci/
          if-no-files-found: warn
  kubernetes:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project-scoped verified cluster tools
        run: bash scripts/setup_kubernetes_tools.sh
      - name: Check Kubernetes storage, monitoring and rollback
        run: python3 scripts/check_kubernetes.py
      - name: Upload Kubernetes results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-check-results
          path: artifacts/kubernetes-check/
          if-no-files-found: warn
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, containers, kubernetes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, mlflow]
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested revision
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true
