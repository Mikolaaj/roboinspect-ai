[project]
name = "roboinspect-ai"
version = "0.2.0"
description = "Typed mission execution and local operator API for a Gazebo inspection robot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pillow>=10,<13",
  "numpy>=1.26,<3",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
  "mlflow>=3,<4",
  "faster-whisper>=1.2,<2",
  "av>=14,<17",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboinspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
